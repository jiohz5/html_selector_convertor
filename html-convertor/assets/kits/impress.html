<!doctype html>
<html lang="ko" %%HTML_ATTRS%%>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1024">
  <title>%%TITLE%%</title>
  <!--HC:HEAD-->
  <style>
    /* ── 키트: impress.js 캔버스형 발표 — 슬라이드가 공간에 배치되고 이동·회전·확대로 전환된다 ──
       스페이스/→ 다음, ← 이전, 마지막 단계는 전체 개요 */
    html, body { height: 100%; }
    body { background: var(--hc-bg); overflow: hidden; }
    .hc-impress-fallback { padding: 24px; }
    .step { width: 1000px; min-height: 620px; padding: 48px 56px; box-sizing: border-box; background: var(--hc-surface); color: var(--hc-fg); border-radius: var(--hc-radius); box-shadow: 0 20px 60px rgba(0,0,0,.18); font-size: 26px; line-height: 1.5; transition: opacity 1s; }
    .impress-enabled .step { opacity: .25; }
    .impress-enabled .step.active { opacity: 1; }
    .step h1 { font-size: 64px; line-height: 1.1; margin: 0 0 16px; letter-spacing: -.02em; }
    .step h2 { font-size: 40px; margin: 0 0 24px; }
    .step .hc-kicker { font-size: 15px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--hc-primary); margin-bottom: 10px; }
    .step .hc-sub { font-size: 28px; color: var(--hc-muted); margin: 0 0 32px; }
    .step .hc-meta { font-size: 16px; color: var(--hc-muted); display: flex; gap: 28px; border-top: 3px solid var(--hc-primary); padding-top: 12px; width: fit-content; }
    .step-title { display: flex; flex-direction: column; justify-content: center; }
    .step .hc-kpi-grid { grid-template-columns: repeat(2, 1fr); font-size: 16px; }
    .step .hc-kpi-value { font-size: 46px; }
    .step .hc-prose { font-size: 22px; }
    .step .hc-prose .hc-figure { font-size: 15px; }
    .step .hc-table-card { font-size: 16px; box-shadow: none; }
    .step .hc-table-tools { display: none; }
    .step .hc-note, .step .hc-chart-sub { font-size: 16px; color: var(--hc-muted); }
    .step-overview { background: transparent; box-shadow: none; }
    .hc-impress-tools { position: fixed; left: 16px; bottom: 14px; z-index: 30; display: flex; gap: 6px; opacity: .55; }
    .hc-impress-hint { position: fixed; right: 16px; bottom: 16px; font-size: 12px; color: var(--hc-muted); z-index: 30; }
  </style>
  <!--HC:STYLE-->
</head>
<body class="%%BODY_CLASS%% impress-not-supported">
  <div id="impress" data-transition-duration="1000" data-region="slides"></div>
  <div class="hc-impress-tools hc-no-print"><button class="hc-btn" type="button" data-action="theme" aria-label="테마 전환"><span data-slot="theme-icon">☾</span></button></div>
  <div class="hc-impress-hint hc-no-print">스페이스·방향키로 이동 · %%CREDIT%%</div>

  <template id="tpl-slide-title">
    <div class="step step-title">
      <div class="hc-kicker" data-slot="author"></div>
      <h1 data-slot="title"></h1>
      <p class="hc-sub" data-slot="subtitle"></p>
      <div class="hc-meta"><span data-slot="generatedAt"></span><span data-slot="source"></span></div>
    </div>
  </template>
  <template id="tpl-slide-summary">
    <div class="step"><div class="hc-kicker">Summary</div><h2>핵심 요약</h2><div data-slot="body"></div></div>
  </template>
  <template id="tpl-slide-kpis">
    <div class="step"><div class="hc-kicker">Key numbers</div><h2 data-slot="title"></h2><div class="hc-kpi-grid" data-slot="kpis"></div></div>
  </template>
  <template id="tpl-kpi" data-good="" data-bad="" data-flat="">
    <div class="hc-card hc-kpi">
      <div class="hc-kpi-label" data-slot="label"></div>
      <div class="hc-kpi-value" data-slot="value"></div>
      <div class="hc-kpi-meta"><span class="hc-delta" data-slot="delta"></span><span data-slot="delta-label"></span><span data-slot="hint"></span></div>
      <div class="hc-spark" data-slot="spark"></div>
    </div>
  </template>
  <template id="tpl-slide-section">
    <div class="step"><h2 data-slot="title"></h2><div class="hc-prose" data-slot="body"></div></div>
  </template>
  <template id="tpl-figure">
    <div class="hc-figure"><div data-slot="chart" style="height:280px"></div><p class="hc-note"><b data-slot="title"></b> <span data-slot="subtitle"></span> <span data-slot="note"></span></p></div>
  </template>
  <template id="tpl-slide-chart">
    <div class="step"><h2 data-slot="title"></h2><p class="hc-chart-sub" data-slot="subtitle"></p><div data-slot="chart"></div><p class="hc-note" data-slot="note"></p></div>
  </template>
  <template id="tpl-slide-table">
    <div class="step"><h2 data-slot="title"></h2><div data-slot="body"></div></div>
  </template>
  <template id="tpl-table" data-num="hc-num" data-badge-good="hc-badge hc-badge-good" data-badge-warn="hc-badge hc-badge-warn" data-badge-bad="hc-badge hc-badge-bad" data-badge-info="hc-badge hc-badge-info" data-badge-neutral="hc-badge hc-badge-neutral">
    <div class="hc-card hc-table-card">
      <div class="hc-table-tools"><span data-slot="title"></span><span data-slot="subtitle"></span><input data-slot="search"></div>
      <div class="hc-table-wrap"><table class="hc-table" data-slot="table"></table></div>
      <div class="hc-table-foot"><span data-slot="count"></span><button class="hc-btn" type="button" data-slot="more" hidden></button></div>
    </div>
  </template>
  <template id="tpl-callout" data-info="hc-callout-info" data-good="hc-callout-good" data-warn="hc-callout-warn" data-bad="hc-callout-bad">
    <div class="hc-callout"><strong data-slot="title"></strong><div data-slot="text"></div></div>
  </template>
  <template id="tpl-slide-end">
    <div class="step step-overview" id="overview" data-scale="6"></div>
  </template>

  <script>
    window.HC_AFTER_RENDER = function () {
      // 슬라이드를 나선형으로 배치한다: 2열씩 내려가며 살짝 회전, 마지막은 전체 개요
      var steps = Array.prototype.slice.call(document.querySelectorAll('#impress > .step:not(#overview)'));
      steps.forEach(function (s, i) {
        var col = i % 3, row = Math.floor(i / 3);
        s.dataset.x = String(col * 1300 - 1300);
        s.dataset.y = String(row * 900);
        s.dataset.z = String(i % 2 ? -200 : 0);
        s.dataset.rotate = String((col - 1) * 8);
        if (!s.id) s.id = 'step-' + (i + 1);
      });
      var ov = document.getElementById('overview');
      if (ov) { ov.dataset.x = '0'; ov.dataset.y = String(Math.floor((steps.length - 1) / 3) * 450); ov.dataset.scale = String(Math.max(3, Math.ceil(steps.length / 3) + 1.5)); }
      if (!window.impress) { document.body.insertAdjacentHTML('afterbegin', '<p class="hc-impress-fallback">impress.js를 불러오지 못했습니다(인터넷 연결 확인).</p>'); return; }
      var api = impress();
      api.init();
      document.addEventListener('impress:stepenter', function () { if (window.HC) setTimeout(window.HC.flush, 50); });
    };
  </script>
  <!--HC:BODY_END-->
</body>
</html>
